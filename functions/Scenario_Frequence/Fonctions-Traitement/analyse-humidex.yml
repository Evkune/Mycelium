version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  analyse-humidex:
    lang: python3-flask
    handler: ./analyse-humidex
    image: myceliumir/analyse-humidex:latest
    annotations:
      topic: fonction_chaleur
    environment:
      MORE_DATA: "false"
      HISTORY_PATH: "/data"
    build_args:
      ADDITIONAL_PACKAGE: "numpy pandas scipy"
    secrets:
      - mqtt-credentials
    labels:
      com.openfaas.scale.min: 1
      com.openfaas.scale.max: 3
    limits:
      memory: 256Mi
      cpu: 200m
    requests:
      memory: 128Mi
      cpu: 100m