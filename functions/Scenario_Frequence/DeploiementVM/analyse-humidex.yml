version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  analyse-humidex:
    lang: python3-flask
    handler: ./analyse-humidex
    image: ttl.sh/arnolec/analyse-humidex:2h
    annotations:
      topic: fonction_chaleur
      functionId: analyse-humidex-fn
      tag: 1.0
    environment:
      MORE_DATA: "false"
      HISTORY_PATH: "/data"
      MQTT_CLIENTID: analyse-humidex
      MQTT_URL: tcp://10.0.2.15:1883
    labels:
      com.openfaas.scale.min: 1
      com.openfaas.scale.max: 3
    limits:
      memory: 256Mi
      cpu: 200m
    requests:
      memory: 128Mi
      cpu: 100m