version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080
functions:
  function-2:
    lang: python3
    build_args:
      PYTHON_VERSION: 3.10
    handler: ./function-2
    image: ttl.sh/arnolec/function-2:2h
    environment:
      # MQTT Configuration
      MQTT_CLIENTID: function-2
      MQTT_BROKER: 10.0.2.15
      MQTT_PORT: 1883
      write_debug: true
    annotations:
      topic: processedData
      functionId: function-2
      tag : 1.0