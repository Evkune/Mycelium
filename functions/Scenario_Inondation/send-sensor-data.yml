version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:8080

functions:
  send-sensor-data:
    lang: python3
    build_args:
      PYTHON_VERSION: 3.10
    # Handler relatif au répertoire 'functions/' depuis lequel le justfile se lance
    handler: Scenario_Inondation/send-sensor-data
    image: ttl.sh/evan/send-sensor-data:2h
    environment:
      MQTT_CLIENTID: send-sensor-data
      MQTT_URL: tcp://10.0.2.15:1883
      write_debug: true

configuration:
  copy:
    - Scenario_Inondation/send-sensor-data/hourly_rainfall_train.csv
    - Scenario_Inondation/send-sensor-data/hourly_water_level_train.csv

