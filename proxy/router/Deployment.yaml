apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: openfaas
  name: router
  labels:
    app: proxy-router
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-router
  template:
    metadata:
      labels:
        app: proxy-router
    spec:
      containers:
      - name: proxy-router
        image: docker.io/sky010/proxy-router:latest
        ports:
        - containerPort: 8080
        env:
        - name: client-id
          value: "routerCluster"
        - name: broker
          value: "tcp://10.0.2.15:1883"
        - name: url-monitoring
          value: "http://monitoring-service.openfaas.svc.cluster.local:8080"
        - name: url-invoker
          value: "http://invoker-service.openfaas.svc.cluster.local:8080"
        - name: url-other-invoker
          value: "http://vps-invoker-service.openfaas-2.svc.cluster.local:8080"