apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: metrics-reader
rules:
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: metrics-reader-binding
subjects:
- kind: ServiceAccount
  name: default
  namespace: openfaas
roleRef:
  kind: ClusterRole
  name: metrics-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: openfaas
  labels:
    app: proxy-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-monitor
  template:
    metadata:
      labels:
        app: proxy-monitor
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - nikos0
      tolerations:
      - key: "key"
        operator: "Equal"
        value: "value"
        effect: "NoExecute"
      containers:
      - name: mqtt-monitoring
        image: docker.io/sky010/proxy-monitor:armv7
        ports:
        - containerPort: 8080
        env:
        - name: gw-url
          value: "http://gateway.openfaas:8080"
        - name: gw-username
          value: "admin"
        - name: gw-password
          valueFrom:
            secretKeyRef:
              name: basic-auth
              key: basic-auth-password
        - name: PORT
          value: "8080"
        - name: other-monitoring-service
          value: "http://100.104.175.11:30080"

---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-service
  namespace: openfaas
spec:
  selector:
    app: proxy-monitor
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort