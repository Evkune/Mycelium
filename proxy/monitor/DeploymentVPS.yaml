apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: openfaas-2
  labels:
    app: proxy-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-monitor
  template:
    metadata:
      labels:
        app: proxy-monitor
    spec:
      containers:
      - name: proxy-monitor
        image: docker.io/sky010/proxy-monitor:latest
        ports:
        - containerPort: 8080
        env:
        - name: gw-url
          value: "http://gateway.openfaas-2:8080"
        - name: gw-username
          value: "admin"
        - name: gw-password
          valueFrom:
            secretKeyRef:
              name: basic-auth
              key: basic-auth-password
        - name: PORT
          value: "8080"
        - name: other-monitoring-service
          value: "http://monitoring-service.openfaas.svc.cluster.local:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: vps-monitoring-service
  namespace: openfaas-2
spec:
  selector:
    app: proxy-monitor
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
  type: ClusterIP